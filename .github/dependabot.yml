version: 2
updates:
  # The interview submission is dependency-locked for exact reproduction.
  # Setting the limit to zero suppresses routine version-update PRs while
  # Dependabot security alerts and security updates remain available.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
