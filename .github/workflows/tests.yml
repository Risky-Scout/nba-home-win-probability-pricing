name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile
        run: |
          python -m py_compile             nba_win_probability.py             enhanced_governance.py             challenger_analysis.py             ablation_and_timing.py             research/team_specific_home_effects.py             validate_submission.py
      - name: Test
        run: pytest -q
