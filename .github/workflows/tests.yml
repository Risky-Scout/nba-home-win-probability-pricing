name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            requirements-challengers.txt

      - name: Verify supported interpreter
        run: python scripts/check_python.py

      - name: Install exact development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile all Python sources
        run: |
          python -m compileall -q             nba_win_probability.py             enhanced_governance.py             challenger_analysis.py             ablation_and_timing.py             project_runtime.py             run_submission.py             validate_submission.py             research             scripts             tests

      - name: Run warning-clean unit tests
        run: python -m pytest -q

      - name: Validate public-repository policy
        run: python scripts/check_repository_policy.py

      - name: Validate committed artifacts
        run: python scripts/validate_committed_artifacts.py

      - name: Check whitespace and patch integrity
        run: git diff --check
