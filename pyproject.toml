[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-home-win-probability-pricing"
version = "1.2.0"
description = "Leakage-safe NBA home-win probability pricing and governance"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
  {name = "Joseph Shackelford"}
]
dependencies = [
  "numpy==2.4.6",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "PyYAML==6.0.3",
]
challengers = [
  "xgboost==3.1.3",
  "catboost==1.2.8",
  "shap==0.50.0",
  "scipy==1.17.0",
]

[tool.setuptools]
py-modules = [
  "nba_win_probability",
  "enhanced_governance",
  "challenger_analysis",
  "ablation_and_timing",
  "project_runtime",
  "run_submission",
  "validate_submission",
]
packages = ["research"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]
filterwarnings = ["error"]
